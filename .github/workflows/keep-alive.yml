name: Supabase Keep Alive

on:
    schedule:
        # Daily at 09:00 UTC
        - cron: "0 9 * * *"
    workflow_dispatch: {}

jobs:
    ping-health:
        runs-on: ubuntu-latest
        steps:
            - name: Call health endpoint (DB keepalive)
              env:
                  HEALTH_API_SECRET: ${{ secrets.HEALTH_API_SECRET }}
              run: |
                  set -euo pipefail

                  url="https://www.qrpilot.app/api/health"

                  for attempt in 1 2 3 4 5; do
                    echo "Attempt ${attempt}: calling ${url}"

                    response_file=$(mktemp)
                    headers_file=$(mktemp)

                    status=$(curl --connect-timeout 10 --max-time 20 \
                      --location \
                      -sS \
                      -o "$response_file" \
                      -D "$headers_file" \
                      -H "x-cron-secret: ${HEALTH_API_SECRET}" \
                      "$url" \
                      -w "%{http_code}")

                    cat "$headers_file"
                    cat "$response_file"
                    echo

                    rm -f "$response_file" "$headers_file"

                    if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
                      echo "Health check succeeded on attempt ${attempt}."
                      exit 0
                    fi

                    if [ "$attempt" -lt 5 ]; then
                      echo "Health check returned HTTP ${status}. Waiting 20 seconds before retry..."
                      sleep 20
                    fi
                  done

                  echo "Health check failed after 5 attempts."
                  exit 1
