name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qrpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Dummy value so prisma.config.ts can load during install/generate.
    # This does NOT connect to Supabase.
    env:
      DIRECT_URL: postgresql://user:pass@localhost:5432/postgres
      DATABASE_URL: postgresql://user:pass@localhost:5432/postgres
      # Optional: avoid prisma postinstall generate if you don't need it in CI
      PRISMA_SKIP_POSTINSTALL_GENERATE: "true"

    steps:
      - uses: actions/checkout@v4

      # Install pnpm properly (adds it to PATH)
      - uses: pnpm/action-setup@v4

      # Node + pnpm cache
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate
      - name: Push database schema
        run: pnpm prisma db push
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      # Force HTML report output so playwright-report/ exists
      - name: Run Playwright tests
        run: pnpm exec playwright test --reporter=html

      # Upload report even if tests fail
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
